name: Build VAHF APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -d "${ANDROID_HOME}/cmdline-tools/latest/bin" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore and env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          touch .env

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare direct APK copy
        run: cp app/build/outputs/apk/debug/app-debug.apk VAHF-app-debug.apk

      - name: Upload VAHF Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VAHF-app-debug-apk
          path: VAHF-app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk VAHF-app-debug.apk \
            --title "VAHF App (Latest APK)" \
            --notes "Direct Debug APK build for VAHF Yoga & Wellness." \
            --latest
